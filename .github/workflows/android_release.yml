name: Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Version Code (e.g. 1)'
        required: true
        default: '1'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Update version in build.gradle
        run: |
          sed -i "s/versionCode .*/versionCode ${{ github.event.inputs.version_code }}/" app/build.gradle
          sed -i "s/versionName .*/versionName \"${{ github.event.inputs.version_name }}\"/" app/build.gradle

      - name: Decode Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_FILE }}" ]; then
            echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > app/release.keystore
          else
            # Create a default keystore if secrets not available
            echo "⚠️ Keystore not found in secrets, creating default..."
            keytool -genkey -v -keystore app/release.keystore \
              -alias carsaidev \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass carsaidev \
              -keypass carsaidev \
              -dname "CN=CEditor, OU=CEditor, O=CEditor, L=Unknown, ST=Unknown, C=Unknown"
          fi

      - name: Build Release APK
        run: gradle assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'carsaidev' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'carsaidev' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'carsaidev' }}

      - name: Build Release AAB
        run: gradle bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'carsaidev' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'carsaidev' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'carsaidev' }}

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ github.event.inputs.version_name }}" -m "Release v${{ github.event.inputs.version_name }}"
          git push origin "v${{ github.event.inputs.version_name }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version_name }}
          name: Release v${{ github.event.inputs.version_name }}
          body: |
            ## 🚀 Release v${{ github.event.inputs.version_name }}
            
            ### 📥 Downloads
            - **APK**: [Download APK](https://github.com/${{ github.repository }}/releases/download/v${{ github.event.inputs.version_name }}/app-release.apk)
            - **AAB**: [Download AAB](https://github.com/${{ github.repository }}/releases/download/v${{ github.event.inputs.version_name }}/app-release.aab)
            
            ---
            *Signed release build generated automatically by GitHub Actions.*
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ceditor-release-${{ github.event.inputs.version_name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
