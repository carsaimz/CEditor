name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Version Code (e.g. 1)'
        required: true
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version_name }}" >> $GITHUB_ENV
            echo "CODE=${{ github.event.inputs.version_code }}" >> $GITHUB_ENV
          else
          # Auto-increment version on push
          LATEST_TAG=$(git tag -l 'v*' --sort=-version:refname | head -1 | sed 's/^v//' 2>/dev/null || echo "0.0.0")
          if [ -z "$LATEST_TAG" ] || ! echo "$LATEST_TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            LATEST_TAG="0.0.0"
          fi
          # Extract version parts and bump minor
          MAJOR=$(echo $LATEST_TAG | cut -d. -f1)
          MINOR=$(echo $LATEST_TAG | cut -d. -f2)
          PATCH=$(echo $LATEST_TAG | cut -d. -f3)
          NEW_MINOR=$((MINOR + 1))
          echo "VERSION=${MAJOR}.${NEW_MINOR}.${PATCH}" >> $GITHUB_ENV
          # Use current unix timestamp as version code
          echo "CODE=$(date +%s)" >> $GITHUB_ENV
          fi

      - name: Update version in build.gradle
        run: |
          sed -i "s/versionCode .*/versionCode ${{ env.CODE }}/" app/build.gradle
          sed -i "s/versionName .*/versionName \"${{ env.VERSION }}\"/" app/build.gradle

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Build Debug AAB
        run: gradle bundleDebug

      - name: Generate Changelog
        id: changelog
        run: |
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          git log -n 5 --pretty=format:"- %s" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ env.VERSION }}" -m "Debug build v${{ env.VERSION }}"
          git push origin "v${{ env.VERSION }}"

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Debug v${{ env.VERSION }}
          body: |
            ### 🛠️ Debug Build
            - **Version**: ${{ env.VERSION }}
            - **Run ID**: ${{ github.run_id }}
            - **Commit**: ${{ github.sha }}
            
            ### 📝 Recent Changes
            ${{ env.CHANGELOG }}
            
            ### 📥 Downloads
            [![Download APK](https://img.shields.io/badge/Download-APK-green?style=for-the-badge&logo=android)](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/app-debug.apk)
          prerelease: true
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/debug/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ceditor-debug-${{ env.VERSION }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/debug/*.aab
