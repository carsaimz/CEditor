name: Android Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.0.0-debug)'
        required: true
        default: '1.0.0-debug'
      version_code:
        description: 'Version Code (e.g. 1)'
        required: true
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Build Debug AAB
        run: gradle bundleDebug

      - name: Generate Changelog
        id: changelog
        run: |
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          git log -n 5 --pretty=format:"- %s" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.event.inputs.version_name }}-${{ github.run_id }}
          name: Debug Build v${{ github.event.inputs.version_name }}
          body: |
            ### 🛠️ Debug Build Info
            - **Run ID**: ${{ github.run_id }}
            - **Commit**: ${{ github.sha }}
            
            ### 📝 Recent Changes
            ${{ env.CHANGELOG }}
            
            ### 📥 Downloads
            [![Download APK](https://img.shields.io/badge/Download-APK-green?style=for-the-badge&logo=android)](https://github.com/${{ github.repository }}/releases/download/debug-${{ github.event.inputs.version_name }}-${{ github.run_id }}/app-debug.apk)
          prerelease: true
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/debug/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ceditor-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/debug/*.aab
